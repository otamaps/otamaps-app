<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OtaMaps — Locations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --surface-2:#efece4;
    --border:#e1ddd2;
    --text:#22231f;
    --text-muted:#726d5f;
    --accent:#1f6f5c;
    --accent-soft:#dcece7;
    --accent-2:#c2540c;
    --accent-2-soft:#f8e2d2;
    --danger:#b3261e;
    --shadow:0 1px 2px rgba(34,32,24,.06), 0 8px 24px -12px rgba(34,32,24,.18);
    --radius:10px;
    font-variant-numeric:tabular-nums;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1a17; --surface:#222220; --surface-2:#2a2a26; --border:#3a3934;
      --text:#eeece4; --text-muted:#a29c8b; --accent:#5fbfa2; --accent-soft:#203330;
      --accent-2:#e08a4f; --accent-2-soft:#3a2a1d; --danger:#e5837c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1a17; --surface:#222220; --surface-2:#2a2a26; --border:#3a3934;
    --text:#eeece4; --text-muted:#a29c8b; --accent:#5fbfa2; --accent-soft:#203330;
    --accent-2:#e08a4f; --accent-2-soft:#3a2a1d; --danger:#e5837c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size:14px; line-height:1.45;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;}

  /* ---------- Login screen ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); padding:26px 26px 22px;
  }
  .login-card .brand{
    font-weight:700; font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; margin:0 0 4px;
  }
  .login-card .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;}
  .login-card p.sub{color:var(--text-muted); font-size:12.5px; margin:0 0 18px;}
  .field-row{display:grid; gap:6px; margin-bottom:14px;}
  .field-row label{font-size:12px; font-weight:600; color:var(--text-muted);}
  .field-row input{
    padding:9px 11px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-family:inherit; font-size:13.5px; width:100%;
  }
  .field-row input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:8px; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; width:100%; padding:10px 14px;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{border-color:transparent;}
  .btn.small{padding:3px 9px; font-size:11.5px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .form-error{
    background:var(--accent-2-soft); color:var(--accent-2); border-radius:8px; padding:9px 11px;
    font-size:12.5px; margin-bottom:14px; display:none;
  }
  .form-error.show{display:block;}

  /* ---------- App shell ---------- */
  .app{display:grid; grid-template-columns:320px 1fr; min-height:100vh;}
  .sidebar{
    border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; min-width:0; max-height:100vh; position:sticky; top:0;
  }
  .sidebar-head{padding:20px 18px 14px; border-bottom:1px solid var(--border);}
  .brand{font-weight:700; font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; margin:0 0 12px;}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;}
  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%; padding:9px 12px 9px 32px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13px; font-family:inherit;
  }
  .search-wrap input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .search-wrap svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--text-muted); pointer-events:none;
  }
  .filter-meta{margin-top:8px; font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;}
  .filter-meta .refresh-btn{
    border:none; background:none; color:var(--accent); cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; padding:0;
  }

  .user-list{overflow-y:auto; flex:1; padding:6px;}
  .user-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border-radius:8px; border:none; background:transparent; color:var(--text);
    cursor:pointer; font-family:inherit; font-size:13px;
  }
  .user-item:hover{background:var(--surface-2);}
  .user-item.active{background:var(--accent-soft);}
  .user-item .swatch{width:9px; height:9px; border-radius:50%; flex:none;}
  .user-item .u-name{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .user-item .u-cls{font-size:10.5px; color:var(--text-muted); background:var(--surface-2); border-radius:5px; padding:1px 6px; flex:none;}
  .user-item .u-loc{
    margin-left:auto; font-size:10.5px; color:var(--text-muted); flex:none; max-width:120px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;
  }
  .user-item .u-loc.has-loc{color:var(--accent); font-weight:600;}
  .no-results{padding:24px 16px; color:var(--text-muted); font-size:12.5px; text-align:center;}

  .sidebar-foot{border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sidebar-foot .who{font-size:11.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- Main ---------- */
  .main{padding:26px 34px 60px; min-width:0;}
  .empty-state{max-width:420px; margin:10vh auto 0; text-align:center; color:var(--text-muted);}
  .empty-state h2{color:var(--text); font-size:19px; margin-bottom:8px;}

  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap;}
  .who{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:44px; height:44px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#fff; flex:none;
  }
  .who h1{font-size:20px; margin:0 0 2px; letter-spacing:-.01em;}
  .who .sub{font-size:12.5px; color:var(--text-muted);}

  .detail-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:6px;}
  .detail-grid .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .detail-grid .card h3{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:0 0 8px; font-weight:600;}
  .detail-grid .card .stat{font-size:19px; font-weight:700;}
  .detail-grid .card .stat.muted{color:var(--text-muted); font-weight:500; font-size:14px;}

  .banner{
    background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius);
    padding:11px 14px; font-size:12.5px; color:var(--text); margin-bottom:16px;
  }
  .banner.warn{background:var(--accent-2-soft); color:var(--accent-2);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--border);}
    .main{padding:20px;}
  }

  [hidden]{display:none !important;}
</style>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <p class="brand"><span class="dot"></span>OtaMaps</p>
    <p class="sub">Sign in with your OtaMaps account to view live user locations.</p>
    <div id="login-error" class="form-error"></div>
    <form id="login-form">
      <div class="field-row">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" required>
      </div>
      <div class="field-row">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit" id="login-submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app-root" class="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-head">
      <p class="brand"><span class="dot"></span>OtaMaps</p>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search name, class, id…" autocomplete="off">
      </div>
      <div class="filter-meta">
        <span id="result-count">— users</span>
        <button class="refresh-btn" id="refresh-btn">Refresh</button>
      </div>
    </div>
    <div class="user-list" id="user-list"></div>
    <div class="sidebar-foot">
      <span class="who mono" id="whoami"></span>
      <button class="btn ghost small" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.1/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  // Same Supabase project + public anon (publishable) key the OtaMaps app
  // itself ships with (lib/supabase.ts) — safe to embed client-side.
  var SUPABASE_URL = "https://db.otamaps.fi";
  var SUPABASE_ANON_KEY = "sb_publishable_uCmYsYm1XBz2H-DkGp5KOt_kH5qdBrg";

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  var state = {
    session: null,
    users: [],           // [{id,name,email,cls,color,code}]
    locations: {},        // user_id -> {x,y,floor,updated_at,beacons}
    rooms: {},             // room_id -> {room_number,title,floor}
    beacons: {},           // ble_id -> room_id
    filter: "",
    selectedUserId: null,
    loadError: null
  };

  // ---------- helpers ----------
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function initials(name){
    var parts = (name||"?").trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function contrastColor(hex){
    if(!hex || hex[0] !== "#") return "#111";
    var h = hex.slice(1);
    if(h.length === 3) h = h.split("").map(function(c){return c+c;}).join("");
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    var yiq = (r*299 + g*587 + b*114) / 1000;
    return yiq >= 150 ? "#161513" : "#ffffff";
  }
  function timeAgo(iso){
    if(!iso) return null;
    var ms = Date.now() - new Date(iso).getTime();
    if(ms < 0) ms = 0;
    var m = Math.floor(ms/60000);
    if(m < 1) return "just now";
    if(m < 60) return m + "m ago";
    var h = Math.floor(m/60);
    if(h < 24) return h + "h ago";
    return Math.floor(h/24) + "d ago";
  }

  // classes look like "24K" (year 24, letter K) or "23KLM" (year 23, combined
  // letters K/L/M — any of those letters counts as a match for that class)
  var CLASS_RE = /^(\d{2,4})([a-z]*)$/i;
  function parseClass(cls){
    if(!cls) return null;
    var m = CLASS_RE.exec(cls.trim());
    if(!m) return null;
    return { year: m[1], letters: m[2].toUpperCase().split("") };
  }
  function classQueryMatches(u, qParsed){
    if(!qParsed) return false;
    var ci = parseClass(u.cls);
    if(!ci || ci.year !== qParsed.year) return false;
    if(qParsed.letters.length === 0) return true;
    return qParsed.letters.every(function(l){ return ci.letters.indexOf(l) > -1; });
  }
  function matches(u, q){
    if(!q) return true;
    q = q.toLowerCase();
    var qParsed = parseClass(q);
    if(qParsed) return classQueryMatches(u, qParsed);
    return (u.name && u.name.toLowerCase().indexOf(q) > -1) ||
           (u.email && u.email.toLowerCase().indexOf(q) > -1) ||
           (u.cls && u.cls.toLowerCase().indexOf(q) > -1) ||
           (u.id && u.id.toLowerCase().indexOf(q) > -1) ||
           (u.code && String(u.code).toLowerCase().indexOf(q) > -1);
  }

  // strongest (closest) beacon reported in a location's beacon scan
  function strongestBeaconId(beacons){
    if(!Array.isArray(beacons) || beacons.length === 0) return null;
    var candidates = beacons.filter(function(b){
      return b && typeof b === "object" && "id" in b && typeof b.distance === "number";
    });
    if(candidates.length === 0) return null;
    var best = candidates[0];
    candidates.forEach(function(c){ if(c.distance < best.distance) best = c; });
    return String(best.id);
  }

  function resolveLocation(uid){
    var loc = state.locations[uid];
    if(!loc) return { text: "No location", room: null, floor: null, updated: null, hasLoc: false };
    var beaconId = strongestBeaconId(loc.beacons);
    var roomId = beaconId != null ? state.beacons[beaconId] : null;
    var room = roomId ? state.rooms[roomId] : null;
    var label = null;
    if(room){
      var sameText = room.room_number && room.title &&
        room.room_number.trim().toLowerCase() === room.title.trim().toLowerCase();
      if(room.room_number && room.title && !sameText) label = room.room_number + " · " + room.title;
      else label = room.room_number || room.title;
    }
    if(!label && typeof loc.floor === "number") label = "Floor " + loc.floor;
    if(!label && typeof loc.x === "number" && typeof loc.y === "number") label = loc.x.toFixed(0) + ", " + loc.y.toFixed(0);
    return {
      text: label || "No location",
      room: room,
      floor: typeof loc.floor === "number" ? loc.floor : (room ? room.floor : null),
      updated: loc.updated_at,
      hasLoc: !!label
    };
  }

  // ---------- data loading ----------
  function setLoadError(msg){ state.loadError = msg; }

  function loadData(){
    return Promise.all([
      supabase.from("users").select("id,name,email,class,color,code"),
      supabase.from("locations").select("user_id,x,y,floor,updated_at,beacons"),
      supabase.from("beacons").select("ble_id,room_id"),
      supabase.from("rooms").select("id,room_number,title,floor")
    ]).then(function(results){
      var usersRes = results[0], locsRes = results[1], beaconsRes = results[2], roomsRes = results[3];
      var firstError = usersRes.error || locsRes.error;
      if(firstError){
        setLoadError(firstError.message || "Failed to load data.");
      } else {
        setLoadError(null);
      }

      state.users = (usersRes.data || []).map(function(u){
        return { id: u.id, name: u.name || u.email, email: u.email, cls: u.class, color: u.color || "#4A89EE", code: u.code };
      });

      state.locations = {};
      (locsRes.data || []).forEach(function(l){ state.locations[l.user_id] = l; });

      state.beacons = {};
      (beaconsRes.data || []).forEach(function(b){ state.beacons[String(b.ble_id)] = b.room_id; });

      state.rooms = {};
      (roomsRes.data || []).forEach(function(r){ state.rooms[r.id] = r; });
    });
  }

  // ---------- sidebar ----------
  var listEl = document.getElementById("user-list");
  var countEl = document.getElementById("result-count");
  var mainEl = document.getElementById("main");

  function renderList(){
    var q = state.filter.trim();
    var filtered = state.users.filter(function(u){ return matches(u, q); });
    filtered.sort(function(a,b){
      var la = resolveLocation(a.id).hasLoc, lb = resolveLocation(b.id).hasLoc;
      if(la !== lb) return la ? -1 : 1;
      return (a.name||"").localeCompare(b.name||"");
    });

    countEl.textContent = filtered.length + " of " + state.users.length + " users";

    if(filtered.length === 0){
      listEl.innerHTML = '<div class="no-results">No one matches “' + escapeHtml(q) + '”.</div>';
      return;
    }

    listEl.innerHTML = filtered.slice(0, 500).map(function(u){
      var loc = resolveLocation(u.id);
      var active = u.id === state.selectedUserId ? " active" : "";
      return '<button class="user-item' + active + '" data-id="' + u.id + '">' +
        '<span class="swatch" style="background:' + escapeHtml(u.color) + '"></span>' +
        '<span class="u-name">' + escapeHtml(u.name) + '</span>' +
        (u.cls ? '<span class="u-cls">' + escapeHtml(u.cls) + '</span>' : '') +
        '<span class="u-loc' + (loc.hasLoc ? ' has-loc' : '') + '">' + escapeHtml(loc.text) + '</span>' +
      '</button>';
    }).join("");
  }

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest(".user-item");
    if(!btn) return;
    state.selectedUserId = btn.getAttribute("data-id");
    renderList();
    renderMain();
  });

  document.getElementById("search").addEventListener("input", function(e){
    state.filter = e.target.value;
    renderList();
  });

  document.getElementById("refresh-btn").addEventListener("click", function(){
    refreshAll();
  });

  // ---------- main panel ----------
  function renderMain(){
    if(state.loadError){
      mainEl.innerHTML = '<div class="banner warn">Could not load data: ' + escapeHtml(state.loadError) +
        '. If this persists, your account likely does not have admin access to the users/locations tables.</div>';
      return;
    }
    if(!state.selectedUserId){
      mainEl.innerHTML = '<div class="empty-state">' +
        '<h2>Pick someone to see their location</h2>' +
        '<p>Search by name, class/year (e.g. “24” or “24K”), or id on the left.</p>' +
      '</div>';
      return;
    }
    var u = state.users.find(function(x){ return x.id === state.selectedUserId; });
    if(!u){ mainEl.innerHTML = ""; return; }
    var loc = resolveLocation(u.id);
    var ago = timeAgo(loc.updated);

    var html = '';
    html += '<div class="panel-head">';
    html += '  <div class="who">';
    html += '    <div class="avatar" style="background:' + escapeHtml(u.color) + ';color:' + contrastColor(u.color) + '">' + escapeHtml(initials(u.name)) + '</div>';
    html += '    <div><h1>' + escapeHtml(u.name) + '</h1><div class="sub">' + escapeHtml(u.cls || "no class") + ' · ' + escapeHtml(u.email || "") + '</div></div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="detail-grid">';
    html += '<div class="card"><h3>Location</h3><div class="stat' + (loc.hasLoc ? '' : ' muted') + '">' + escapeHtml(loc.text) + '</div></div>';
    if(loc.floor != null){
      html += '<div class="card"><h3>Floor</h3><div class="stat">' + escapeHtml(loc.floor) + '</div></div>';
    }
    html += '<div class="card"><h3>Last update</h3><div class="stat muted">' + escapeHtml(ago || "never") + '</div></div>';
    html += '</div>';

    mainEl.innerHTML = html;
  }

  // ---------- auth ----------
  var loginScreen = document.getElementById("login-screen");
  var appRoot = document.getElementById("app-root");
  var loginForm = document.getElementById("login-form");
  var loginError = document.getElementById("login-error");
  var loginSubmit = document.getElementById("login-submit");

  function showLoggedIn(session){
    state.session = session;
    loginScreen.hidden = true;
    appRoot.hidden = false;
    document.getElementById("whoami").textContent = session.user.email || "";
    refreshAll();
  }

  function showLoggedOut(){
    state.session = null;
    appRoot.hidden = true;
    loginScreen.hidden = false;
  }

  function refreshAll(){
    listEl.innerHTML = '<div class="no-results">Loading users…</div>';
    loadData().then(function(){
      renderList();
      renderMain();
    }).catch(function(err){
      setLoadError((err && err.message) || String(err));
      renderList();
      renderMain();
    });
  }

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    loginError.classList.remove("show");
    loginSubmit.disabled = true;
    loginSubmit.textContent = "Signing in…";
    var email = document.getElementById("login-email").value.trim();
    var password = document.getElementById("login-password").value;
    supabase.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginSubmit.disabled = false;
      loginSubmit.textContent = "Sign in";
      if(res.error){
        loginError.textContent = res.error.message;
        loginError.classList.add("show");
        return;
      }
      showLoggedIn(res.data.session);
    });
  });

  document.getElementById("logout-btn").addEventListener("click", function(){
    supabase.auth.signOut().then(function(){ showLoggedOut(); });
  });

  supabase.auth.onAuthStateChange(function(event, session){
    if(session) showLoggedIn(session);
    else showLoggedOut();
  });

  supabase.auth.getSession().then(function(res){
    if(res.data.session) showLoggedIn(res.data.session);
